[preset.0]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; .scm files are plain TextFiles to Godot and are skipped by "all resources".
; Include them explicitly: the bridge unpacks them from the PCK on first run.
include_filter="*.scm"
; The 378 MB GGUF stays outside the PCK; put it beside the app or set
; $THEFORD_MODEL. Without it the game still runs on canned dialogue.
exclude_filter="models/*,TODO.md,context.md"
export_path="export/The Ford.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
application/modify_resources=true
application/icon=""
application/bundle_identifier="com.theford.ford"
application/signature=""
application/copyright="The Ford — a local-LLM pixel village demo"
